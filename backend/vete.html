<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Veterinarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./estilosVete.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand" href="index.html">Veterinaria</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Abrir menú"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="mascotas.html">Mascotas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="vete.html" aria-current="page">
                                Veterinarios
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-4">
        <h1 class="text-center mb-4">Gestión de Veterinarios</h1>
        <section class="card mb-4" aria-labelledby="tituloFormulario">
            <div class="card-header" id="tituloFormulario">
                Alta / Modificación de Veterinarios
            </div>
            <div class="card-body">
                <form id="formVeterinario">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="matricula" class="form-label">Matrícula</label>
                            <input
                                type="number"
                                id="matricula"
                                class="form-control"
                                min="0"
                                step="1"
                                required
                            >
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="especializacion" class="form-label">
                                Especialización
                            </label>
                            <input
                                type="text"
                                id="especializacion"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="valorConsulta" class="form-label">
                                Valor de la consulta
                            </label>
                            <input
                                type="number"
                                id="valorConsulta"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" id="btnGuardar" class="btn btn-success">
                            Guardar
                        </button>
                        <button type="reset" class="btn btn-secondary">
                            Limpiar
                        </button>
                        <button
                            type="button"
                            id="btnCancelar"
                            class="btn btn-outline-secondary"
                            hidden
                        >
                            Cancelar edición
                        </button>
                    </div>
                </form>
            </div>
        </section>
        <p class="mb-3">
            Total de veterinarios:
            <span id="totalVeterinarios" aria-live="polite">0</span>
        </p>
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <caption class="visually-hidden">Lista de veterinarios registrados</caption>
                <thead class="table-success">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Matrícula</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Especialización</th>
                        <th scope="col">Valor de consulta</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaVeterinarios"></tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="vete.js"></script>
</body>
</html>
