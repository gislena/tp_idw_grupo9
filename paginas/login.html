<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Veterinaria Patas Arriba</title>

    <link href__="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href__="../estilos/estilos.css">
    <script src="../scripts/sesion.js"></script>
</head>

<body class="pagina-login">
    <header class="encabezado">
        <nav class="navbar navbar-expand-lg navegacion" aria-label="Navegación principal">
            <div class="contenedor-navegacion">
                <a class="logo-contenedor" href__="../index.html">
                    <img src="../assets/images/Logo.png" alt="Logo Veterinaria Patas Arriba" class="logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto text-center">
                        <li class="nav-item"><a href__="../index.html" class="nav-link">Inicio</a></li>
                        <li class="nav-item"><a href__="institucional.html" class="nav-link">Información institucional</a></li>
                        <li class="nav-item"><a href__="../index.html#servicios" class="nav-link">Servicios</a></li>
                        <li class="nav-item"><a href__="contactos.html" class="nav-link">Contacto</a></li>
                        <li class="nav-item">
                            <a href__="login.html" class="nav-link activo" aria-current="page">Iniciar sesión</a>
                        </li>
                        <li class="nav-item">
                            <button id="botonTema" class="nav-link boton-tema" type="button" aria-pressed="false">
                                🌙 Modo oscuro
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="text-center mb-4">
            <h1 class="titulo-seccion">Iniciar sesión</h1>
            <p class="lead">Área de administración de la veterinaria.</p>
        </section>

        <section class="card shadow-sm p-4 mx-auto tarjeta-login">
            <div id="mensajeLogin" aria-live="polite"></div>

            <form id="formularioLogin" novalidate>
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" name="usuario"
                        autocomplete="username" required>
                    <div class="invalid-feedback">Ingresá tu usuario.</div>
                </div>

                <div class="mb-3">
                    <label for="clave" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="clave" name="clave"
                        autocomplete="current-password" required>
                    <div class="invalid-feedback">Ingresá tu contraseña.</div>
                </div>

                <button type="submit" id="botonIngresar" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <p class="form-text mt-3 mb-0">El acceso está reservado al personal de la veterinaria.</p>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>&copy; 2026 Veterinaria Patas Arriba</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/tema.js"></script>
    <script src="../scripts/login.js"></script>
</body>
</html>
